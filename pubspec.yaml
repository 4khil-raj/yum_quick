name: yum_quick
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cached_network_image: ^4.0.4
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  shimmer: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logos/app_launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F5CB58"
  adaptive_icon_foreground: "assets/logos/app_launcher_foreground.png"
